name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check the tag belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check versions and extract release notes
        run: node tools/release.mjs "$GITHUB_REF_NAME" dist/release-notes.md
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Package the tagged source and checksum
        run: |
          set -euo pipefail
          package="paseo-claude-auth-switch-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="${package}/" "$GITHUB_SHA" | gzip -n > "dist/${package}.tar.gz"
          cd dist
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Claude Auth Switch ${GITHUB_REF_NAME#v}" --notes-file dist/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber
